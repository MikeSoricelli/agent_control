[project]
name = "agent-control"
version = "0.1.0"
description = "ControlArena red-vs-blue control experiments"
authors = [
    { name = "Michael Soricelli", email = "mikesoricelli2@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "control-arena==20.1.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: requires a running Docker daemon",
    "live: makes live model API calls (needs OPENROUTER_API_KEY)",
]
